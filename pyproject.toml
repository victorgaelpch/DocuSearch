[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docusearch-ai"
version = "0.1.0"
description = "Buscador de documentos en español: ingesta, PLN y recuperación"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "spacy>=3.8,<3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
]
# Modelo spaCy en español fijado por versión (licencia GPL-3.0, ver docs/preprocesamiento.md).
model = [
  "es_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
