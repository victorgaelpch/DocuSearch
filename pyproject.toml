[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docusearch-ai"
version = "0.1.0"
description = "Buscador de documentos en español: ingesta, PLN y recuperación"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "spacy>=3.8,<3.9",
  "mwparserfromhell>=0.6,<1",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "psutil>=5.9,<8",
]
# Modelo spaCy en español fijado por versión (licencia GPL-3.0, ver docs/preprocesamiento.md).
model = [
  "es_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
]

# Búsqueda semántica (v0.2): instala PyTorch. En Linux, para evitar la variante
# CUDA, instalar antes torch desde https://download.pytorch.org/whl/cpu (ver docs/embeddings.md).
semantic = [
  "sentence-transformers>=6.3,<7",
  "faiss-cpu>=1.8,<2",
]

# Evaluación con MIRACL (lectura de parquet, DOC-16).
eval = [
  "pyarrow>=14",
]

[tool.setuptools.packages.find]
include = ["backend", "backend.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "semantic_model: usa el modelo de embeddings real (requiere el extra semantic y DOCUSEARCH_TEST_SEMANTIC_MODEL=1)",
]
