name: Python checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Tesseract OCR (DOC-23)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa
      - name: Install project and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,model]"
          # FAISS sin PyTorch: las pruebas del índice usan un codificador simulado
          python -m pip install "faiss-cpu>=1.8,<2"
      - name: Run tests
        run: python -m pytest -q

  # Pruebas de la web en un navegador real (DOC-33). Check obligatorio con
  # nombre estable `web-e2e`: login, carga PDF/DOCX/TXT, visor, búsqueda,
  # edición, eliminación, panel de índices, teclado, CSP y XSS. Usa un
  # codificador de prueba para la híbrida (el modelo real va en semantic-model).
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCUSEARCH_TEST_BROWSER: "1"
      DOCUSEARCH_E2E_ARTIFACTS: e2e-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa
      - name: Install project, E2E tools and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,model,e2e]"
          python -m pip install "faiss-cpu>=1.8,<2"
          python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -q tests/e2e -rs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-evidencias
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # Instalación limpia y demostración en Windows (DOC-34): ejecuta los scripts
  # de PowerShell con Windows PowerShell 5.1, carga la demo, inicia el servidor
  # en 127.0.0.1 y lo recorre por HTTP (login, carga, búsqueda BM25, web).
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar con el script (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\windows\instalar.ps1
      - name: Crear cuenta y cargar la demostración
        shell: powershell
        run: |
          $pw = [guid]::NewGuid().ToString()
          $pw | .\.venv\Scripts\python.exe -m backend.app.cli hash-password --stdin --env-file .env
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Set-Content -Path "$env:RUNNER_TEMP\pw.txt" -Value $pw -NoNewline
          # Comprobación aislada: el hash guardado en .env corresponde a la contraseña
          $check = @"
          import os, pathlib, sys
          sys.path.insert(0, '.')
          from backend.app.config import load_env_file
          from backend.app.auth.passwords import verify_password
          load_env_file()
          pw = pathlib.Path(os.environ['RUNNER_TEMP'], 'pw.txt').read_text(encoding='utf-8-sig')
          assert verify_password(pw, os.environ['DOCUSEARCH_ADMIN_PASSWORD_HASH']), 'hash in .env does not match the password'
          print('hash in .env verified')
          "@
          Set-Content -Path "$env:RUNNER_TEMP\check.py" -Value $check
          .\.venv\Scripts\python.exe "$env:RUNNER_TEMP\check.py"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\.venv\Scripts\python.exe -m backend.app.cli demo
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell -ExecutionPolicy Bypass -File scripts\windows\verificar.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Iniciar y recorrer el servidor
        shell: powershell
        run: |
          $job = Start-Job -ScriptBlock { param($r) Set-Location $r; powershell -ExecutionPolicy Bypass -File scripts\windows\iniciar.ps1 -NoAbrir } -ArgumentList (Get-Location).Path
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) { try { Invoke-RestMethod http://127.0.0.1:8000/health | Out-Null; $ok = $true; break } catch { Start-Sleep 2 } }
          if (-not $ok) { Receive-Job $job; throw "el servidor no arrancó" }
          $web = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          if ($web.Content -notmatch "DocuSearch") { throw "la página principal no se sirvió" }
          $js = Invoke-WebRequest http://127.0.0.1:8000/assets/js/app.js -UseBasicParsing
          if ($js.Headers["Content-Type"] -notmatch "javascript") { throw "app.js sin tipo JavaScript: $($js.Headers['Content-Type'])" }
          # ReadAllText: en PowerShell 5.1, Get-Content añade propiedades que ConvertTo-Json serializa
          $pw = [System.IO.File]::ReadAllText("$env:RUNNER_TEMP\pw.txt")
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $login = Invoke-RestMethod -Method Post http://127.0.0.1:8000/auth/login -WebSession $s -ContentType "application/json" -Body (@{username="admin"; password=$pw} | ConvertTo-Json)
          $docs = Invoke-RestMethod http://127.0.0.1:8000/documents -WebSession $s
          if ($docs.total -ne 4) { throw "se esperaban 4 documentos de demostración, hay $($docs.total)" }
          # "acuíferos subterráneos" ya codificado: el script del paso no depende de su codificación
          $r = Invoke-RestMethod "http://127.0.0.1:8000/search?q=acu%C3%ADferos%20subterr%C3%A1neos" -WebSession $s
          if ($r.results[0].original_filename -ne "ciclo-del-agua.pdf") { throw "BM25: resultado inesperado $($r.results[0].original_filename)" }
          Write-Host "Windows: install, account, demo and BM25 search verified ($($r.took_ms) ms)"
          Stop-Job $job; Remove-Job $job -Force

  # Docker Compose local (DOC-41): construye la imagen sin publicarla, arranca
  # con compose, espera el healthcheck, recorre el flujo por HTTP y comprueba
  # que los datos persisten en el volumen tras reiniciar y recrear el servicio.
  docker-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python (para generar el hash)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crear .env con una contraseña aleatoria
        run: |
          python -m pip install -q -e .
          PW=$(python -c "import secrets; print(secrets.token_urlsafe(18))")
          echo "::add-mask::$PW"
          echo "$PW" > "$RUNNER_TEMP/pw.txt"
          printf '%s\n' "$PW" | python -m backend.app.cli hash-password --stdin --env-file .env
      - name: Construir y arrancar
        run: docker compose up -d --build
      - name: Esperar healthcheck
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q docusearch)")
            [ "$state" = "healthy" ] && break
            sleep 3
          done
          docker compose ps
          [ "$state" = "healthy" ] || { docker compose logs; exit 1; }
      - name: Solo 127.0.0.1 y recorrido HTTP
        run: |
          docker compose port docusearch 8000 | grep -q '^127.0.0.1:8000$'
          python - <<'PY'
          import json, os, pathlib, urllib.request, http.cookiejar
          base = "http://127.0.0.1:8000"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          pw = pathlib.Path(os.environ["RUNNER_TEMP"], "pw.txt").read_text().strip()
          def call(method, path, data=None, headers=None):
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers or {})
              with opener.open(req, timeout=60) as r:
                  return json.loads(r.read() or b"null")
          login = call("POST", "/auth/login", json.dumps({"username": "admin", "password": pw}).encode(), {"Content-Type": "application/json"})
          csrf = login["csrf_token"]
          boundary = "dsboundary"
          text = "Los acuiferos subterraneos abastecen de agua potable a las ciudades.".encode()
          body = (f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"agua.txt\"\r\n"
                  f"Content-Type: text/plain\r\n\r\n").encode() + text + f"\r\n--{boundary}--\r\n".encode()
          call("POST", "/documents", body, {"Content-Type": f"multipart/form-data; boundary={boundary}", "X-CSRF-Token": csrf})
          hits = call("GET", "/search?q=acuiferos")["results"]
          assert hits and hits[0]["original_filename"] == "agua.txt", hits
          ready = call("GET", "/health/ready")
          assert ready["status"] == "ready" and ready["optional"]["ocr"] is True, ready
          print("Docker: login, carga, búsqueda y preparación verificadas")
          PY
      - name: Persistencia tras reiniciar y recrear
        run: |
          docker compose restart
          sleep 8
          docker compose down
          docker compose up -d
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/health >/dev/null && break; sleep 2; done
          python - <<'PY'
          import json, os, pathlib, urllib.request, http.cookiejar
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          pw = pathlib.Path(os.environ["RUNNER_TEMP"], "pw.txt").read_text().strip()
          req = urllib.request.Request("http://127.0.0.1:8000/auth/login", data=json.dumps({"username": "admin", "password": pw}).encode(), headers={"Content-Type": "application/json"}, method="POST")
          opener.open(req, timeout=30)
          docs = json.loads(opener.open("http://127.0.0.1:8000/documents", timeout=30).read())
          assert docs["total"] == 1 and docs["items"][0]["original_filename"] == "agua.txt", docs
          print("Docker: el documento persiste en el volumen tras recrear el contenedor")
          PY
          docker run --rm --entrypoint sh docusearch-local:1.1 -c 'test ! -e /data/metadata.db' && echo "la imagen no contiene datos"
      - name: Limpiar
        if: always()
        run: docker compose down -v

  # Pruebas con el modelo de embeddings real (DOC-17). Es opcional: no bloquea
  # el PR si falla (p. ej. por un corte de Hugging Face), pero su resultado se
  # ve en los checks. El modelo (~460 MB) se guarda en la caché de Actions.
  # Desde DOC-33 incluye la búsqueda por paráfrasis desde el navegador.
  semantic-model:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    env:
      DOCUSEARCH_TEST_SEMANTIC_MODEL: "1"
      DOCUSEARCH_TEST_BROWSER: "1"
      DOCUSEARCH_E2E_ARTIFACTS: e2e-artifacts
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-paraphrase-multilingual-MiniLM-L12-v2-e8f8c211
      - name: Install project with semantic extra (PyTorch CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,model,semantic,e2e]"
          python -m playwright install --with-deps chromium
      - name: Run real-model tests (API y navegador)
        run: python -m pytest -q -m semantic_model -rs
