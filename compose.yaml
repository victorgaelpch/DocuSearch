# DocuSearch AI con Docker Compose (DOC-41). Uso local: ver docs/docker.md.
#   docker compose up -d --build
#   http://127.0.0.1:8000/
services:
  docusearch:
    build:
      context: .
      args:
        WITH_OCR: "1"        # Tesseract con español
        WITH_SEMANTIC: "0"   # "1" instala PyTorch CPU y FAISS (~1 GB más)
    image: docusearch-local:1.1
    ports:
      - "127.0.0.1:8000:8000"   # solo esta computadora; nunca 0.0.0.0
    env_file:
      - path: .env               # hash del Administrador y ajustes; no se versiona
        required: false
    volumes:
      - docusearch-data:/data    # originales, SQLite, índices y modelos descargados
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  docusearch-data:
